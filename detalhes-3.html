<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salto - OUTSIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>w

<body>
    <header class="barra-navegacao"><a class="nome-loja" href="index.html">OUTSIDE</a><a class="botao-voltar"
            href="catalogo.html">Voltar ao catálogo</a>
        <form class="busca" action="#" method="get"><input type="search" placeholder="Buscar produto"><button
                type="submit">Buscar</button></form>
    </header>
    <main class="container">
        <h1 class="titulo-pagina">Detalhes do produto</h1>
        <section class="produto-detalhe"><img class="imagem-detalhe" src="https://i.pinimg.com/736x/fa/7d/97/fa7d97a1ffbf88583d6a03f8c5424ca2.jpg" alt="Tênis Casual">
            <div class="informacoes-produto">
                <h2>Elegância em Cada Passo</h2>
                <p>Um par de saltos muda tudo.</p>
                <p class="preco">Preço: R$ 189,99</p><a class="botao botao-comprar" href="#">Comprar agora</a>
            </div>
        </section>
        <section class="formulario-promocoes">
            <h2>Receber promoções deste produto</h2>
            <form action="#mensagem" method="get"><label for="email">Digite seu e-mail:</label><br><input type="email"
                    id="email" name="email" placeholder="seuemail@email.com" required><label class="termos"><input
                        type="checkbox" required> Aceito os termos de uso.</label><button type="submit">Enviar</button>
            </form>
            <p id="mensagem" class="mensagem-sucesso">E-mail cadastrado com sucesso!</p>
        </section>
    </main>
    <footer class="rodape">
        <p>OUTSIDE</p>
    </footer>
</body>

</html>
